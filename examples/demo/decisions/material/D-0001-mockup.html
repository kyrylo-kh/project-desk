<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calm: home screen</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f6f1e7; color: #3d3a33; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 20px; }
  .card { background: #fff; border: 1px solid #e2d9c8; border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0 0 18px; }
  h2 { font-size: 16px; margin: 0 0 6px; }
  p { margin: 0; color: #6d675b; }
  button { margin-top: 12px; background: #2f6f5e; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Good morning</h1>
  <div class="card"><h2>Continue where you left off</h2><p>Your last note was edited yesterday.</p><button type="button">Open it</button></div>
  <div class="card"><h2>Start something new</h2><p>A blank note, or one of your templates.</p><button type="button">New note</button></div>
</main>
</body>
</html>
