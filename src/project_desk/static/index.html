<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Project Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23a8361a'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 5.5' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/js/theme.js"></script>
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <!-- The shell. /static/js/main.js reads /api/config, fills the labels in the UI language and mounts
       one tab per enabled module (each module's /static/modules/<name>/tab.js) inside #app. -->
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
        <span class="brand-name">Project Desk</span>
        <span class="brand-root mono" id="root-name"></span>
      </div>
      <nav class="desks" id="modes" data-i18n-aria="ui.sections"></nav>
      <div class="topbar-right">
        <span class="sync" id="sync" aria-live="polite"></span>
        <label class="theme-pick">
          <span class="sr-only" data-i18n="ui.theme">Theme</span>
          <select id="theme"></select>
        </label>
        <button class="btn-quiet" type="button" id="help-button" aria-haspopup="dialog">
          <span data-i18n="ui.shortcuts">Shortcuts</span> <kbd>?</kbd>
        </button>
      </div>
    </header>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" data-i18n-aria="ui.preview" hidden>
    <div class="lightbox-bar">
      <span class="lightbox-title mono" id="lightbox-title"></span>
      <span class="lightbox-count" id="lightbox-count"></span>
      <span class="lightbox-actions">
        <a id="lightbox-open" target="_blank" rel="noopener" data-i18n="ui.open_new_tab">Open in new tab</a>
        <button type="button" class="btn-quiet" data-close><span data-i18n="ui.close">Close</span> <kbd>Esc</kbd></button>
      </span>
    </div>
    <div class="lightbox-stage" id="lightbox-stage"></div>
    <button type="button" class="lightbox-nav prev" data-nav="-1" data-i18n-aria="ui.preview_prev">&larr;</button>
    <button type="button" class="lightbox-nav next" data-nav="1" data-i18n-aria="ui.preview_next">&rarr;</button>
  </div>

  <div class="overlay" id="help" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="help-title" data-i18n="ui.help_title">Keyboard shortcuts</h2>
        <button type="button" class="btn-quiet" data-close><span data-i18n="ui.close">Close</span> <kbd>Esc</kbd></button>
      </div>
      <div class="keys" id="help-keys"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
